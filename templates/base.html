<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | CyberShield</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <span class="brand">CyberShield</span>
    <nav>
      {% for path, label in nav %}
      <a href="{{ path }}"{% if request.path == path %} class="active"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Simulation only: all traffic is local (127.0.0.1). Times are UTC.</footer>
</body>
</html>
